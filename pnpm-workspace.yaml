# pnpm 12 blocks dependency install scripts by default; only these are allowed explicitly.
allowBuilds:
  esbuild: true
  sharp: true

# Also install the WebAssembly builds of native packages, used automatically when a native binary
# can't load (e.g. Windows Smart App Control blocking a freshly released `.node` file).
supportedArchitectures:
  os:
    - current
  cpu:
    - current
    - wasm32

# Advisories fixed by a local patch (no upstream release yet); `pnpm audit` can't see patches.
# Drop the patch and the entry once a fixed version ships.
auditConfig:
  ignoreGhsas:
    # http-cache-semantics (via astro): max-stale no longer serves responses zeroed for security.
    - GHSA-ch52-4w7c-c8xp

patchedDependencies:
  http-cache-semantics@4.2.0: patches/http-cache-semantics@4.2.0.patch

# Patched versions of vulnerable transitive dependencies (pnpm audit).
overrides:
  'katex@>=0.11.0 <0.18.2': '^0.18.2'
  'postcss-selector-parser@<7.1.6': '^7.1.6'
  'source-map-js@<1.2.2': '^1.2.2'
