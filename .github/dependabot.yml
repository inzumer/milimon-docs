version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      # Days 1 and 15 of each month, like the other Milimon repos.
      cronjob: '0 9 1,15 * *'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 9 1,15 * *'
      timezone: Europe/Madrid
    commit-message:
      prefix: ci
